name: CI and Release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, Prettier, Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run Prettier check
        run: npm run format:check

      - name: Build app bundle
        run: npm run build

  release-build:
    name: Build release package (${{ matrix.target }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app bundle
        run: npm run build

      - name: Package release artifact
        run: |
          npm pack --pack-destination dist/release
          mv dist/release/xdraw-*.tgz "dist/release/xdraw-${{ github.ref_name }}-${{ matrix.target }}.tgz"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdraw-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/release/xdraw-${{ github.ref_name }}-${{ matrix.target }}.tgz
          if-no-files-found: error

  release-publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
